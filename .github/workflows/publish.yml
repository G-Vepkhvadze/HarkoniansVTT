name: Build and Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Extract tag version number
        id: get_version
        uses: battila7/get-version-action@v2

      - name: Run Vite build
        env:
          MODULE_VERSION: ${{ steps.get_version.outputs.version-without-v }}
          GH_PROJECT: ${{ github.repository }}
          GH_TAG: ${{ github.ref_name }}
        run: yarn build

      - name: Copy favicon to dist
        run: cp src/styles/favicon.ico dist/

      - name: Remove sourcemaps from dist
        run: find dist -name "*.map" -delete

      - name: Create Foundry module directory
        run: |
          mkdir -p harkoniansvtt
          cp -r dist/* harkoniansvtt/

      - name: Verify module structure
        run: |
          echo "Module contents:"
          find harkoniansvtt -maxdepth 3 -type f | sort

          test -f harkoniansvtt/module.json
          test -f harkoniansvtt/scripts/main.js
          test -f harkoniansvtt/styles/harkonians.css

      - name: Create module ZIP
        run: |
          zip -r harkoniansvtt.zip harkoniansvtt/
          echo "ZIP contents:"
          unzip -l harkoniansvtt.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HarkoniansVTT ${{ steps.get_version.outputs.version-without-v }}
          body: |
            Automated release for HarkoniansVTT module version ${{ steps.get_version.outputs.version-without-v }}.

            ## Installation

            In Foundry VTT:

            1. Open Add-on Modules.
            2. Select Install Module.
            3. Enter the Manifest URL:

            https://github.com/G-Vepkhvadze/HarkoniansVTT/releases/latest/download/module.json

          draft: false
          prerelease: false
          files: |
            harkoniansvtt.zip
            dist/module.json
          fail_on_unmatched_files: true