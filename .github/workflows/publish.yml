name: Build and Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: yarn

      - name: Extract tag version number
        id: get_version
        uses: battila7/get-version-action@v2

      - name: Run Vite build
        env:
          MODULE_VERSION: ${{steps.get_version.outputs.version-without-v}}
          GH_PROJECT: ${{github.repository}}
          GH_TAG: ${{github.ref_name}}
        run: yarn build

      - name: Copy favicon to dist
        run: cp src/styles/favicon.ico dist/

      - name: Remove sourcemaps from dist
        run: find dist -name "*.map" -delete

      - name: Create module directory structure
        run: |
          mkdir -p harkoniansvtt
          cp -r dist/* harkoniansvtt/

      - name: Create zip archive
        run: zip -r harkoniansvtt.zip harkoniansvtt/

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{github.ref_name}}
          name: Release ${{github.ref_name}}
          body: |
            Automated release for HarkoniansVTT module version ${{steps.get_version.outputs.version-without-v}}.
            
            **Manifest URL:** https://github.com/G-Vepkhvadze/HarkoniansVTT/releases/latest/download/module.json
            
            **Installation:** Use Foundry's "Install Module → Manifest URL" and enter the manifest URL above.
          draft: false
          prerelease: false
          files: |
            dist/module.json
            harkoniansvtt.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
