name: Release HarkoniansVTT

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read module version
        id: version
        run: |
          VERSION=$(node -p "require('./module.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches module version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION="${{ steps.version.outputs.version }}"

          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "Version mismatch!"
            exit 1
          fi

      - name: Create module archive
        run: |
          mkdir -p release

          zip -r release/harkoniansvtt.zip \
            src \
            styles \
            templates \
            module.json \
            README.md

      - name: Copy module manifest
        run: |
          cp module.json release/module.json

      - name: Delete previous stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete stable --yes || true

      - name: Delete previous stable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method DELETE \
            "/repos/${GITHUB_REPOSITORY}/git/refs/tags/stable" \
            || true

      - name: Create stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          gh release create stable \
            release/harkoniansvtt.zip \
            release/module.json \
            --title "HarkoniansVTT ${VERSION}" \
            --notes "HarkoniansVTT ${VERSION}" \
            --target "${GITHUB_SHA}"