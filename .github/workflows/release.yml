name: Release HarkoniansVTT

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Read module version
        id: version
        shell: bash
        run: |
          VERSION=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('./src/module.json', 'utf8')).version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches module version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION="${{ steps.version.outputs.version }}"

          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "Version mismatch!"
            exit 1
          fi

      - name: Build module with Vite
        run: yarn build

      - name: Verify build output
        run: |
          test -f dist/module.json
          test -f dist/scripts/main.js
          test -f dist/styles/harkonians.css
          test -f dist/templates/link-dialog.hbs

          DIST_VERSION=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('./dist/module.json', 'utf8')).version)")
          SOURCE_VERSION="${{ steps.version.outputs.version }}"

          if [ "$DIST_VERSION" != "$SOURCE_VERSION" ]; then
            echo "Built module version does not match source module version."
            exit 1
          fi

      - name: Create module archive
        run: |
          mkdir -p release
          cd dist && zip -r ../release/harkoniansvtt.zip *

      - name: Copy module manifest
        run: |
          cp dist/module.json release/module.json

      - name: Delete previous stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete stable --yes || true

      - name: Delete previous stable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method DELETE \
            "/repos/${GITHUB_REPOSITORY}/git/refs/tags/stable" \
            || true

      - name: Create stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          gh release create stable \
            release/harkoniansvtt.zip \
            release/module.json \
            --title "HarkoniansVTT ${VERSION}" \
            --notes "HarkoniansVTT ${VERSION}" \
            --target "${GITHUB_SHA}"