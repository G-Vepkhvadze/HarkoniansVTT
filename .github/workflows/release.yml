name: Release HarkoniansVTT

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release manifest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p dist

          jq \
            --arg version "$VERSION" \
            --arg manifest "https://github.com/G-Vepkhvadze/HarkoniansVTT/releases/download/${GITHUB_REF_NAME}/module.json" \
            --arg download "https://github.com/G-Vepkhvadze/HarkoniansVTT/releases/download/${GITHUB_REF_NAME}/module.zip" \
            '.version = $version | .manifest = $manifest | .download = $download' \
            module.json > dist/module.json

      - name: Build module archive
        shell: bash
        run: |
          mkdir -p dist/package

          cp -r src dist/package/
          cp -r templates dist/package/
          cp -r styles dist/package/

          cp dist/module.json dist/package/module.json

          cd dist/package
          zip -r ../module.zip .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "$GITHUB_REF_NAME" \
            dist/module.json \
            dist/module.zip \
            --generate-notes