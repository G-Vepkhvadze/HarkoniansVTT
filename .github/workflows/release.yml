name: Release HarkoniansVTT

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read module version
        id: version
        run: |
          VERSION=$(node -p "require('./module.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "HarkoniansVTT version: $VERSION"

      - name: Verify tag matches module version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION="${{ steps.version.outputs.version }}"

          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "Version mismatch!"
            echo "Git tag:       $TAG_VERSION"
            echo "module.json:   $MODULE_VERSION"
            exit 1
          fi

      - name: Create module archive
        run: |
          mkdir -p release

          zip -r "release/harkoniansvtt-${{ steps.version.outputs.version }}.zip" \
            src \
            styles \
            templates \
            module.json \
            README.md

      - name: Copy module manifest
        run: |
          cp module.json "release/module.json"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/harkoniansvtt-${{ steps.version.outputs.version }}.zip" \
            "release/module.json" \
            --title "HarkoniansVTT ${{ steps.version.outputs.version }}" \
            --generate-notes