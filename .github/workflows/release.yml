name: Release HarkoniansVTT

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read module version
        id: version
        run: |
          VERSION=$(node -p "require('./module.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "HarkoniansVTT version: $VERSION"

      - name: Verify tag matches module version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION="${{ steps.version.outputs.version }}"

          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "Version mismatch!"
            echo "Git tag: $TAG_VERSION"
            echo "module.json: $MODULE_VERSION"
            exit 1
          fi

      - name: Create module archive
        run: |
          mkdir -p release

          zip -r release/harkoniansvtt.zip \
            src \
            styles \
            templates \
            module.json \
            README.md

      - name: Copy module manifest
        run: |
          cp module.json release/module.json

      - name: Verify release files
        run: |
          ls -lah release
          
      - name: Debug GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Current tag: $GITHUB_REF_NAME"
          echo "Existing release:"
          gh release view "$GITHUB_REF_NAME" || echo "NO EXISTING RELEASE"

          echo ""
          echo "Existing releases:"
          gh release list --limit 20   

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"

          echo "Creating release ${TAG}..."

          RELEASE_JSON=$(gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$TAG" \
            -f name="HarkoniansVTT ${VERSION}" \
            -f body="HarkoniansVTT ${VERSION}" \
            -F draft=false \
            -F prerelease=false)

          UPLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.upload_url' | sed 's/{?name,label}//')

          echo "Uploading module.zip..."
          gh api \
            --method POST \
            -H "Content-Type: application/zip" \
            "${UPLOAD_URL}?name=harkoniansvtt.zip" \
            --input release/harkoniansvtt.zip

          echo "Uploading module.json..."
          gh api \
            --method POST \
            -H "Content-Type: application/json" \
            "${UPLOAD_URL}?name=module.json" \
            --input release/module.json

          echo "Release complete!"